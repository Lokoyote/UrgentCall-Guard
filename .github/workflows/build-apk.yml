name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Rendre le wrapper Gradle exécutable
        run: chmod +x ./gradlew
      - name: Configuration de Gradle
        uses: gradle/actions/setup-gradle@v4
        # Pas de "gradle-version" fixé en dur ici : l'action détecte automatiquement
        # la version depuis gradle/wrapper/gradle-wrapper.properties. Ça évite que le
        # workflow se désynchronise du wrapper à chaque montée de version d'AGP
        # (c'est exactement ce qui a cassé le build précédent : action figée sur 8.9,
        # wrapper passé à 8.11.1 pour AGP 8.9.1 -> version minimale non respectée).
      - name: Compiler l'APK debug
        run: ./gradlew assembleDebug
        # ./gradlew (le wrapper du projet), pas "gradle" (le binaire mis en cache par
        # l'action) : c'est ce qui garantit que la version utilisée pour builder est
        # bien celle déclarée dans gradle-wrapper.properties, pas une version à part.
      - name: Publier l'APK en tant qu'artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: UrgentCallGuard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
